<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>直播间Demo</title>
    <!--
      生产构建使用的模板（开发模式用的是 index.html）。

      下面这几个脚本不是多余的：webpack.prod.conf.js 把 vue / vue-router / axios / vonic
      配成了 externals，它们不进 bundle，运行时从全局变量取，所以必须由本文件加载。

      原来这些文件是从 unpkg CDN 加载的，离线环境和内网部署会直接白屏。现在改为加载
      构建时从 node_modules 拷过来的本地副本（见 build/build.js），版本与 yarn.lock
      锁定的一致，不依赖任何外部 CDN。

      路径全部使用相对形式，这样无论部署在域名根目录还是 /LiveDemo 这种子路径下都能正确解析。
    -->
    <link rel="stylesheet" href="vonic/vonic.min.css">
    <script src="js/axios.min.js"></script>
    <script src="js/vue.min.js"></script>
    <script src="js/vue-router.min.js"></script>
    <script src="vonic/vonic.min.js"></script>
  </head>
  <body>
    <von-app></von-app>
    <!-- built files will be auto injected -->
  </body>
</html>
